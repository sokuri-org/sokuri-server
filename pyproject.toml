[tool.ruff]
line-length = 100
target-version = "py310"
indent-width = 4
fix=true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["F403", "F405", "E501", "E402", "E303"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
